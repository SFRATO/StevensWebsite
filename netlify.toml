[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Redirects for form submissions to function
[[redirects]]
  from = "/api/market-report"
  to = "/.netlify/functions/handle-market-report"
  status = 200

# Functions configuration
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    # CSP is shipped in Report-Only first so it cannot break Astro islands, Matomo,
    # GA4, or Google Fonts. Review violation reports, then promote to an enforcing
    # `Content-Security-Policy` header before launch.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.gavinrozzi.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://analytics.gavinrozzi.com https://www.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
