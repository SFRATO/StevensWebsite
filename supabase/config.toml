# Supabase Configuration for Steven Frato Real Estate
# https://supabase.com/docs/guides/cli/config

[project]
id = "vvyrkazsnbkwwvzlcqzx"  # "Stevie's Website" (us-east-1)
name = "steven-frato-emails"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "https://stevenfrato.com"
additional_redirect_urls = ["http://localhost:4321"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# The only account that should exist is the single /admin user, created by hand and
# allow-listed in the admin_users table. Self-service signup would hand any stranger
# an `authenticated` JWT (and enable_confirmations = false means without even owning
# the mailbox). NOTE: this file governs the LOCAL stack only — the hosted project's
# setting lives in Dashboard > Authentication > Providers > Email and must be turned
# off there too.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

# Per-function JWT verification. There is deliberately no blanket setting: the
# Supabase config schema only accepts verify_jwt inside a [functions.<slug>]
# table, and a global `verify_jwt = false` was what left handle-form-submission
# open as an unauthenticated lead-and-email injection endpoint.
#
# Default posture is CLOSED. Two functions opt out because they genuinely cannot
# present a JWT; each establishes authenticity another way.

# Amazon SNS cannot send an Authorization header. Authenticity is established by
# verifying the SNS message signature inside the function (see _shared/snsVerify.ts).
[functions.ses-webhook-handler]
verify_jwt = false

# Reached directly from a link in a delivered email; a mail client has no JWT.
# Authority comes from the HMAC-signed token in the query string.
[functions.unsubscribe]
verify_jwt = false

# Called server-to-server by netlify/functions/handle-market-report.ts, which
# already sends `Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY`.
[functions.send-seller-lead]
verify_jwt = true

[functions.handle-form-submission]
verify_jwt = true

# Invoked by the scheduled Netlify functions, which send the service-role key.
[functions.send-scheduled-emails]
verify_jwt = true

[functions.send-behavior-triggers]
verify_jwt = true

[analytics]
enabled = false
